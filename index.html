<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祝姐姐七夕节快乐</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            background-color: #000012;
            font-family: "Microsoft Yahei", sans-serif;
            overflow: hidden;
            cursor: none;
        }
        /* 初始全屏大爱心页面 */
        .start-page{
            position: fixed;
            inset: 0;
            background-color: #000012;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease;
        }
        .big-heart{
            font-size: 160px;
            color:#ff7eb9;
            animation: bigBeat 1.4s infinite ease-in-out;
            cursor: pointer;
        }
        .tip-text{
            position: absolute;
            bottom: 120px;
            color:#ffd6e8;
            font-size:20px;
        }
        @keyframes bigBeat{
            0%,100%{transform: scale(1);}
            50%{transform: scale(1.18);}
        }
        .hidden{
            opacity: 0;
            pointer-events: none;
        }
        /* 星空光点 */
        .star-bg{
            position: fixed;
            width: 100%;
            height: 100%;
            top:0;
            left:0;
            z-index: 1;
        }
        .star{
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }
        @keyframes twinkle {
            0%,100%{opacity:0.15;}
            50%{opacity:1;}
        }
        /* 花瓣飘落 */
        .petal{
            position: fixed;
            top:-50px;
            color:#ffb6c1;
            font-size:22px;
            z-index: 2;
            pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall{
            0%{
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100%{
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
        /* 鼠标拖尾粒子 */
        .trail{
            position: fixed;
            width:8px;
            height:8px;
            border-radius: 50%;
            background:#ffd6e8;
            pointer-events: none;
            z-index: 999;
            animation: fadeOut 0.8s forwards;
        }
        @keyframes fadeOut{
            0%{opacity:1;transform:scale(1);}
            100%{opacity:0;transform:scale(0);}
        }
        .card{
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            max-width: 520px;
            margin: 0 auto;
            top: 50vh;
            transform: translateY(-50vh);
            animation: fadeUp 1.2s ease-out, float 4s ease-in-out infinite;
        }
        @keyframes fadeUp {
            0%{
                opacity: 0;
                transform: translateY(calc(-50vh + 40px));
            }
            100%{
                opacity: 1;
                transform: translateY(-50vh);
            }
        }
        @keyframes float{
            0%,100%{transform: translateY(-50vh);}
            50%{transform: translateY(calc(-50vh - 12px));}
        }
        h1{
            font-size: 38px;
            color: #ffd6e8;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }
        .sub-text{
            font-size: 18px;
            color: #e4d8ff;
            line-height: 2;
            margin-bottom:30px;
        }
        .wish-text{
            font-size: 20px;
            color: #fff0f7;
            line-height: 2.2;
        }
        .heart{
            color:#ff7eb9;
            font-size:28px;
            margin-top:20px;
            animation: beat 1.5s infinite;
        }
        @keyframes beat{
            0%,100%{transform: scale(1);}
            50%{transform: scale(1.15);}
        }
    </style>
</head>
<body>
    <!-- 开场大爱心 -->
    <div class="start-page" id="startScreen">
        <div class="big-heart">♥</div>
        <div class="tip-text">点击任意位置开启祝福</div>
    </div>

    <div class="star-bg" id="starBox"></div>
    <div id="petalBox"></div>
    <div class="card">
        <h1>祝姐姐七夕节快乐</h1>
        <p class="sub-text">✨ 七月初七 · 佳期如梦 ✨</p>
        <p class="wish-text">
            愿星河璀璨，温柔常伴<br>
            日子浪漫，岁岁欢喜<br>
            所遇皆美好，所愿皆成真<br>
            永远被爱，闪闪发光
        </p>
        <div class="heart">♥</div>
    </div>

    <script>
        //开场点击事件
        const startScreen = document.getElementById('startScreen');
        startScreen.addEventListener('click',()=>{
            startScreen.classList.add('hidden');
        })

        //生成星星
        const starBox = document.getElementById('starBox');
        for(let i = 0; i < 180; i++){
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = Math.random()*3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random()*100 + '%';
            star.style.top = Math.random()*100 + '%';
            star.style.animationDelay = Math.random()*3 + 's';
            starBox.appendChild(star);
        }

        //花瓣飘落
        const petalBox = document.getElementById('petalBox');
        function createPetal(){
            const petal = document.createElement('div');
            petal.classList.add('petal');
            petal.innerText = '❀';
            petal.style.left = Math.random()*100 + '%';
            petal.style.animationDuration = (Math.random()*4 + 4)+'s';
            petalBox.appendChild(petal);
            setTimeout(()=>petal.remove(),8000);
        }
        setInterval(createPetal,400);

        //鼠标星光拖尾
        document.addEventListener('mousemove',(e)=>{
            const trail = document.createElement('div');
            trail.classList.add('trail');
            trail.style.left = e.clientX + 'px';
            trail.style.top = e.clientY + 'px';
            document.body.appendChild(trail);
            setTimeout(()=>trail.remove(),800);
        })
    </script>
</body>
</html>
